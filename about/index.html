<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devam Construction - Calgary, Alberta</title>

    <style>
        /* General styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Header */
        header {
            background: #004aad;
            color: white;
            padding: 20px 0;
        }

        header h1 {
            margin: 0;
            text-align: center;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            padding: 0;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        /* Hero Section */
        .hero {
            background: url('https://images.unsplash.com/photo-1598887142487-d7e34c3c1c25?auto=format&fit=crop&w=1470&q=80')
            no-repeat center center/cover;
            color: white;
            padding: 100px 0;
            text-align: center;
        }

        .hero h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.2em;
        }

        /* Services */
        .services {
            background: #f4f4f4;
            padding: 60px 0;
        }

        .services h2 {
            text-align: center;
            margin-bottom: 40px;
        }

        .service-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .service {
            background: white;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
            box-shadow: 0px 3px 6px rgba(0,0,0,0.1);
        }

        /* About */
        .about {
            padding: 60px 0;
        }

        .about h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .about p {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Contact */
        .contact {
            background: #004aad;
            color: white;
            padding: 60px 0;
            text-align: center;
        }

        .contact h2 {
            margin-bottom: 20px;
        }

        /* Footer */
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px 0;
        }

        /* Responsive */
        @media(max-width: 768px){
            nav ul {
                flex-direction: column;
            }

            .hero h2 {
                font-size: 2em;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="container">
            <h1>Devam Construction</h1>
            <nav>
                <ul>
                    <li><a href="services/">Services</a></li>
                    <li><a href="about/">About</a></li>
                    <li><a href="contact/">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h2>Your Trusted Construction Experts in Calgary</h2>
            <p>Specializing in basements, windows, decks, and garrison making. Licensed and legal work.</p>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2025 Devam Construction. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
